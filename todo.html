<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Planner</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #14141c;
  color: #ddd3d9;
  overscroll-behavior: none;
  padding-bottom: 96px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px 10px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: transparent;
  border: none;
  cursor: pointer;
  color: #cdc2ca;
}

.icon-btn:active {
  background: #26324a;
}

.header-right {
  display: flex;
  gap: 4px;
}

.month-row {
  padding: 4px 22px 8px;
}

.month-label {
  font-weight: 800;
  letter-spacing: 1px;
  color: #c8bcc6;
  font-size: 14px;
}

.date-strip {
  display: flex;
  gap: 8px;
  padding: 6px 18px 14px;
  overflow-x: auto;
  scrollbar-width: none;
}

.date-strip::-webkit-scrollbar {
  display: none;
}

.day-card {
  flex: 0 0 auto;
  background: #22222d;
  border-radius: 14px;
  padding: 10px 12px;
  min-width: 54px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: transform .1s;
  border: 2px solid transparent;
}

.day-card:active {
  transform: scale(0.95);
}

.day-card .dow {
  font-size: 11px;
  color: #9b8e9c;
  font-weight: 600;
}

.day-card .num {
  font-size: 17px;
  font-weight: 700;
  color: #f0e7ed;
  margin-top: 2px;
}

.day-card.active {
  border-color: #5aa9ff;
  background: #1d2b3d;
}

.today-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 24px 8px;
}

.today-title {
  font-weight: 800;
  letter-spacing: 1px;
  color: #c8bcc6;
  font-size: 13px;
}

.today-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}

.fav-btn,
.quick-add {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: grid;
  place-items: center;
}

.fav-btn {
  background: transparent;
  color: #7dd3fc;
}

.quick-add {
  background: #5aa9ff;
  color: #fff;
}

.quick-add:active {
  transform: scale(0.95);
}

.task-list {
  padding: 4px 18px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.task-row {
  position: relative;
}

.task-card {
  background: #23232e;
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  cursor: pointer;
  transition: transform .1s;
  position: relative;
}

.task-card:active {
  transform: scale(0.98);
}

.task-card.group-card {
  background: #22384c;
  padding: 10px 14px;
}

.group-card .group-title {
  font-weight: 700;
  color: #a8d8fa;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.group-card .group-title .del-group {
  background: none;
  border: none;
  color: #bfe0fa;
  cursor: pointer;
  font-size: 16px;
  padding: 2px 6px;
}

.sub-list {
  background: #1b2d3d;
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sub-item {
  display: grid;
  grid-template-columns: 22px 1fr 22px;
  align-items: center;
  gap: 4px;
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 14px;
  color: #d9e8f5;
}

.sub-item.done {
  text-decoration: line-through;
  color: #71808e;
}

.sub-check {
  width: 22px;
  height: 22px;
  border: 2px solid #5aa9ff;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: #23232e;
  cursor: pointer;
}

.sub-check.checked {
  background: #5aa9ff;
  border-color: #5aa9ff;
  color: #fff;
}

.sub-del {
  background: none;
  border: none;
  cursor: pointer;
  color: #93a8ba;
  font-size: 14px;
}

.sub-add-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

.sub-add-input {
  flex: 1;
  border: none;
  background: #23232e;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 13px;
  color: #d9e8f5;
  outline: none;
}

.sub-add-btn {
  background: #5aa9ff;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}

.task-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.task-title {
  font-weight: 700;
  font-size: 15px;
  color: #f0e7ed;
  flex: 1;
}

.task-title.done {
  text-decoration: line-through;
  color: #758592;
}

.task-actions {
  display: flex;
  gap: 2px;
}

.act-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #9cc8f5;
  font-size: 15px;
  padding: 4px 6px;
  border-radius: 6px;
}

.act-btn:active {
  background: #2a3a4a;
}

.task-meta {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #9b8e9c;
}

.empty {
  text-align: center;
  padding: 30px 20px;
  color: #93a8ba;
  font-size: 14px;
}

.empty .big {
  font-size: 36px;
  margin-bottom: 8px;
}

.bottom-nav {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  background: #23232e;
  padding: 8px 14px;
  border-radius: 40px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.55);
}

.nav-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: transparent;
  border: none;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: #9b8e9c;
}

.nav-btn.active {
  background: #24405c;
  color: #7dd3fc;
}

.nav-center {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #5aa9ff;
  color: #fff;
  border: none;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 28px;
  box-shadow: 0 4px 12px rgba(90,169,255,0.4);
  margin: 0 6px;
}

.nav-center:active {
  transform: scale(0.95);
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}

.modal-bg.show {
  display: flex;
}

.modal {
  background: #23232e;
  width: 100%;
  max-width: 480px;
  border-radius: 22px 22px 0 0;
  padding: 18px 20px 24px;
  animation: slideUp .22s ease;
  max-height: 88vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from {
    transform: translateY(40px);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal h3 {
  font-size: 17px;
  color: #f0e7ed;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal h3 .close-x {
  background: none;
  border: none;
  cursor: pointer;
  color: #9b8e9c;
  font-size: 22px;
}

.field {
  margin-bottom: 10px;
}

.field label {
  display: block;
  font-size: 12px;
  color: #9b8e9c;
  margin-bottom: 4px;
  font-weight: 600;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  border: 1px solid #3a3a4f;
  background: #1c1c26;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  color: #e9e0e6;
  outline: none;
  font-family: inherit;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: #5aa9ff;
}

.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1c1c26;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.toggle-row label {
  font-size: 14px;
  color: #e9e0e6;
}

.switch {
  position: relative;
  width: 42px;
  height: 24px;
  background: #3d3d52;
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
}

.switch.on {
  background: #5aa9ff;
}

.switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform .2s;
}

.switch.on::after {
  transform: translateX(18px);
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
}

.btn-cancel {
  background: #2a3747;
  color: #a8d8fa;
}

.btn-save {
  background: #5aa9ff;
  color: #fff;
}

.btn-del {
  background: #3d2030;
  color: #ff8fa3;
}

.drawer-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  z-index: 60;
}

.drawer-bg.show {
  display: block;
}

.drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 78%;
  max-width: 320px;
  background: #1f1f2a;
  padding: 22px 18px;
  transform: translateX(-100%);
  transition: transform .25s;
  z-index: 61;
}

.drawer-bg.show .drawer {
  transform: translateX(0);
}

.drawer h4 {
  font-size: 18px;
  color: #f0e7ed;
  margin-bottom: 14px;
}

.drawer .menu-item {
  padding: 12px 10px;
  border-radius: 10px;
  color: #e9e0e6;
  font-size: 15px;
  cursor: pointer;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.drawer .menu-item:hover {
  background: #26323f;
}

.toast {
  position: fixed;
  left: 50%;
  top: 30px;
  transform: translate(-50%, -100px);
  background: #2e2e3f;
  color: #fff;
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 13px;
  z-index: 100;
  transition: transform .3s;
  pointer-events: none;
}

.toast.show {
  transform: translate(-50%, 0);
}

.view-banner {
  text-align: center;
  color: #9b8e9c;
  font-size: 13px;
  padding: 0 22px 8px;
}
</style>
</head>

<body>

<header class="header">
  <button class="icon-btn" id="menuBtn" aria-label="menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>

  <div class="header-right">
    <button class="icon-btn" id="searchBtn" aria-label="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.3-4.3"/>
      </svg>
    </button>

    <button class="icon-btn" id="notifBtn" aria-label="notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10 21a2 2 0 0 0 4 0"/>
      </svg>
    </button>
  </div>
</header>

<div class="month-row">
  <div class="month-label" id="monthLabel">MAY</div>
</div>

<div class="date-strip" id="dateStrip"></div>

<div class="today-row">
  <div class="today-title" id="todayTitle">TODAY</div>

  <div class="today-actions">
    <button class="fav-btn" id="favToggle" title="Show favorites only">
      <svg id="favIconAll" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 5.5 5.5 5.5 0 0 1 21.5 12C19 16.5 12 21 12 21z"/>
      </svg>
    </button>

    <button class="quick-add" id="quickAddTop" aria-label="quick add">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </div>
</div>

<div class="view-banner" id="viewBanner" style="display:none;"></div>

<main class="task-list" id="taskList"></main>

<nav class="bottom-nav" role="navigation">

  <button class="nav-btn active" data-view="home" aria-label="home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-8 9 8v10H5V10"/>
      <path d="M9 21v-6h6v6"/>
    </svg>
  </button>

  <button class="nav-btn" data-view="calendar" aria-label="calendar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M3 10h18M8 3v4M16 3v4"/>
    </svg>
  </button>

  <button class="nav-center" id="addTaskBtn" aria-label="add task">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <button class="nav-btn" data-view="favorites" aria-label="favorites">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 5.5 5.5 5.5 0 0 1 21.5 12C19 16.5 12 21 12 21z"/>
    </svg>
  </button>

  <button class="nav-btn" data-view="done" aria-label="completed">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <path d="M8 12l3 3 5-6"/>
    </svg>
  </button>

</nav>

<div class="modal-bg" id="modalBg">

  <div class="modal">

    <h3>
      <span id="modalTitle">New Task</span>
      <button class="close-x" id="modalClose">×</button>
    </h3>

    <input type="hidden" id="editId">

    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Morning Run" maxlength="60">
    </div>

    <div class="row-2">

      <div class="field">
        <label>Date</label>
        <select id="fDate"></select>
      </div>

      <div class="field">
        <label>Time</label>
        <input type="time" id="fTime">
      </div>

    </div>

    <div class="row-2">

      <div class="field">
        <label>Duration (min)</label>
        <input type="number" id="fDuration" min="0" max="600" value="30">
      </div>

      <div class="field">
        <label>Type</label>
        <select id="fType">
          <option value="task">Task</option>
          <option value="group">Group (with sub-tasks)</option>
        </select>
      </div>

    </div>

    <div class="field">
      <label>Notes</label>
      <textarea id="fNotes" rows="2" placeholder="Optional..."></textarea>
    </div>

    <div class="toggle-row">
      <label>Favorite ❤️</label>
      <div class="switch" id="fFavSwitch"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-del" id="deleteBtn" style="display:none;">Delete</button>
      <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn btn-save" id="saveBtn">Save</button>
    </div>

  </div>
</div>

<div class="drawer-bg" id="drawerBg">

  <div class="drawer">

    <h4>📒 Daily Planner</h4>

    <div class="menu-item" data-action="all">🗓 All Tasks</div>
    <div class="menu-item" data-action="today">⭐ Today</div>
    <div class="menu-item" data-action="favs">❤️ Favorites</div>
    <div class="menu-item" data-action="done">✅ Completed</div>
    <div class="menu-item" data-action="clear">🧹 Clear All Data</div>
    <div class="menu-item" data-action="about">ℹ️ About</div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

'use strict';

const STORE_KEY = 'pinkPlanner_v1';

const DOW = [
  'Saturday',
  'Sunday',
  'Monday',
  'Tuesday',
  'Wednesday',
  'Thursday',
  'Friday'
];

const SHORT_DOW = [
  'Sat',
  'Sun',
  'Mon',
  'Tue',
  'Wed',
  'Thu',
  'Fri'
];

const MONTHS = [
  'JAN','FEB','MAR','APR','MAY','JUN',
  'JUL','AUG','SEP','OCT','NOV','DEC'
];

let state = {
  tasks: [],
  view: 'today',
  filterFav: false,
  activeDate: null,
  editingId: null
};

function load(){

  try{

    const raw = localStorage.getItem(STORE_KEY);

    if(raw){
      state.tasks = JSON.parse(raw) || [];
    }

  }catch(e){

    state.tasks = [];
  }
}

function save(){

  try{
    localStorage.setItem(
      STORE_KEY,
      JSON.stringify(state.tasks)
    );
  }catch(e){}
}

function uid(){

  return 't' +
    Date.now() +
    Math.floor(Math.random()*999);
}

function todayKey(){

  const d = new Date();

  return d.getFullYear() +
    '-' +
    String(d.getMonth()+1).padStart(2,'0') +
    '-' +
    String(d.getDate()).padStart(2,'0');
}

function dateKey(date){

  return date.getFullYear() +
    '-' +
    String(date.getMonth()+1).padStart(2,'0') +
    '-' +
    String(date.getDate()).padStart(2,'0');
}

function escapeHtml(s){

  return (s || '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function toast(msg){

  const t =
    document.getElementById('toast');

  t.textContent = msg;

  t.classList.add('show');

  clearTimeout(t._timer);

  t._timer = setTimeout(
    () => t.classList.remove('show'),
    1800
  );
}

function buildDateStrip(){

  const strip =
    document.getElementById('dateStrip');

  strip.innerHTML = '';

  const today = new Date();

  today.setHours(0,0,0,0);

  const saturday = new Date(today);

  saturday.setDate(
    today.getDate() -
    ((today.getDay()+1)%7)
  );

  for(let i = 0; i < 7; i++){

    const d = new Date(saturday);

    d.setDate(
      saturday.getDate() + i
    );

    const dk = dateKey(d);

    const card =
      document.createElement('div');

    card.className =
      'day-card' +
      (
        dk === state.activeDate
        ? ' active'
        : ''
      );

    card.innerHTML =
      '<div class="dow">' +
      DOW[i] +
      '</div>' +

      '<div class="num">' +
      (i + 1) +
      '</div>';

    card.onclick = () => {

      state.activeDate = dk;

      state.view = 'all';

      document
        .querySelectorAll('.day-card')
        .forEach(c =>
          c.classList.remove('active')
        );

      card.classList.add('active');

      updateMonthLabel();

      render();
    };

    strip.appendChild(card);

    if(
      dk === todayKey() &&
      !state.activeDate
    ){

      state.activeDate = dk;

      card.classList.add('active');
    }
  }

  updateMonthLabel();
}

function updateMonthLabel(){

  if(!state.activeDate){

    document.getElementById(
      'monthLabel'
    ).textContent =
      MONTHS[new Date().getMonth()];

    return;
  }

  const [y,m,d] =
    state.activeDate
      .split('-')
      .map(Number);

  document.getElementById(
    'monthLabel'
  ).textContent =
    MONTHS[m-1];

  const selected =
    new Date(y,m-1,d);

  const index =
    (selected.getDay()+1)%7;

  document.getElementById(
    'todayTitle'
  ).textContent =
    state.activeDate === todayKey()
      ? 'TODAY'
      : DOW[index].toUpperCase() +
        ' ' +
        (index + 1);
}

function visibleTasks(){

  let arr =
    state.tasks.slice();

  if(state.view === 'today'){

    arr = arr.filter(
      t => t.dateKey === todayKey()
    );

  }else if(state.view === 'all'){

    if(state.activeDate){

      arr = arr.filter(
        t => t.dateKey === state.activeDate
      );
    }

  }else if(state.view === 'favs'){

    arr = arr.filter(t => t.fav);

  }else if(state.view === 'done'){

    arr = arr.filter(t => t.done);
  }

  if(state.filterFav){

    arr = arr.filter(t => t.fav);
  }

  arr.sort((a,b) => {

    if((a.time||'') < (b.time||'')) return -1;

    if((a.time||'') > (b.time||'')) return 1;

    return 0;
  });

  return arr;
}

function render(){

  const list =
    document.getElementById('taskList');

  const banner =
    document.getElementById('viewBanner');

  list.innerHTML = '';

  if(state.filterFav){

    banner.style.display = 'block';
    banner.textContent =
      '❤️ Showing favorites';

  }else if(state.view === 'favs'){

    banner.style.display = 'block';
    banner.textContent =
      '❤️ All favorites';

  }else if(state.view === 'done'){

    banner.style.display = 'block';
    banner.textContent =
      '✅ Completed tasks';

  }else{

    banner.style.display = 'none';
  }

  const items =
    visibleTasks();

  if(items.length === 0){

    list.innerHTML =
      '<div class="empty">' +
        '<div class="big">🌷</div>' +
        'No tasks here yet.<br>' +
        'Tap + to add one.' +
      '</div>';

    return;
  }

  items.forEach(t => {

    const row =
      document.createElement('div');

    row.className = 'task-row';

    const card =
      document.createElement('div');

    if(t.type === 'group'){

      card.className =
        'task-card group-card';

      const head =
        document.createElement('div');

      head.className = 'group-title';

      head.innerHTML =
        '<span>' +
        escapeHtml(t.title) +
        ' 🥤</span>';

      const delBtn =
        document.createElement('button');

      delBtn.className =
        'del-group';

      delBtn.innerHTML = '×';

      delBtn.onclick = e => {

        e.stopPropagation();

        deleteTask(t.id);
      };

      head.appendChild(delBtn);

      card.appendChild(head);

      const sub =
        document.createElement('div');

      sub.className = 'sub-list';

      (t.subs || []).forEach(s => {

        const item =
          document.createElement('div');

        item.className =
          'sub-item' +
          (s.done ? ' done' : '');

        item.innerHTML =
          '<div class="sub-check ' +
          (s.done ? 'checked' : '') +
          '" data-id="' +
          s.id +
          '">' +

          (
            s.done
            ?
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-11"/></svg>'
            :
            ''
          ) +

          '</div>' +

          '<span>' +
          escapeHtml(s.title) +
          '</span>' +

          '<button class="sub-del" data-del="' +
          s.id +
          '">🗑</button>';

        sub.appendChild(item);
      });

      const addRow =
        document.createElement('div');

      addRow.className =
        'sub-add-row';

      addRow.innerHTML =
        '<input class="sub-add-input" placeholder="+ add sub-task">' +
        '<button class="sub-add-btn">Add</button>';

      const inp =
        addRow.querySelector('input');

      const btn =
        addRow.querySelector('button');

      btn.onclick = e => {

        e.stopPropagation();

        const v =
          inp.value.trim();

        if(!v) return;

        t.subs = t.subs || [];

        t.subs.push({
          id: uid(),
          title: v,
          done: false
        });

        save();
        render();
      };

      inp.onkeydown = e => {

        if(e.key === 'Enter'){
          btn.click();
        }
      };

      sub.appendChild(addRow);

      card.appendChild(sub);

      sub
        .querySelectorAll('.sub-check')
        .forEach(el => {

          el.onclick = e => {

            e.stopPropagation();

            const sid =
              el.getAttribute('data-id');

            const s =
              t.subs.find(
                x => x.id === sid
              );

            if(s){

              s.done = !s.done;

              save();
              render();
            }
          };
        });

      sub
        .querySelectorAll('.sub-del')
        .forEach(el => {

          el.onclick = e => {

            e.stopPropagation();

            const sid =
              el.getAttribute('data-del');

            t.subs =
              (t.subs || [])
              .filter(
                x => x.id !== sid
              );

            save();
            render();
          };
        });

    }else{

      card.className =
        'task-card';

      const head =
        document.createElement('div');

      head.className =
        'task-head';

      const titleEl =
        document.createElement('div');

      titleEl.className =
        'task-title' +
        (t.done ? ' done' : '');

      titleEl.innerHTML =
        escapeHtml(t.title) +
        (
          t.fav
          ?
          ' <span style="color:#7dd3fc;">❤️</span>'
          :
          ''
        );

      head.appendChild(titleEl);

      const acts =
        document.createElement('div');

      acts.className =
        'task-actions';

      const doneBtn =
        document.createElement('button');

      doneBtn.className =
        'act-btn';

      doneBtn.innerHTML =
        t.done

        ?

        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6fbf87" stroke-width="2.4" stroke-linecap="round"><path d="M5 12l5 5 9-11"/></svg>'

        :

        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9b8e9c" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/></svg>';

      doneBtn.onclick = e => {

        e.stopPropagation();

        toggleDone(t.id);
      };

      acts.appendChild(doneBtn);

      const favBtn =
        document.createElement('button');

      favBtn.className =
        'act-btn';

      favBtn.innerHTML =
        t.fav

        ?

        '<svg width="16" height="16" viewBox="0 0 24 24" fill="#7dd3fc"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 5.5 5.5 5.5 0 0 1 21.5 12C19 16.5 12 21 12 21z"/></svg>'

        :

        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9b8e9c" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 5.5 5.5 5.5 0 0 1 21.5 12C19 16.5 12 21 12 21z"/></svg>';

      favBtn.onclick = e => {

        e.stopPropagation();

        toggleFav(t.id);
      };

      acts.appendChild(favBtn);

      const editBtn =
        document.createElement('button');

      editBtn.className =
        'act-btn';

      editBtn.innerHTML = '✎';

      editBtn.onclick = e => {

        e.stopPropagation();

        openEdit(t.id);
      };

      acts.appendChild(editBtn);

      const delBtn =
        document.createElement('button');

      delBtn.className =
        'act-btn';

      delBtn.innerHTML = '🗑';

      delBtn.onclick = e => {

        e.stopPropagation();

        deleteTask(t.id);
      };

      acts.appendChild(delBtn);

      head.appendChild(acts);

      card.appendChild(head);

      if(t.notes){

        const meta =
          document.createElement('div');

        meta.className =
          'task-meta';

        meta.innerHTML =
          '<span>📝 ' +
          escapeHtml(t.notes) +
          '</span>';

        card.appendChild(meta);
      }

      card.onclick =
        () => openEdit(t.id);
    }

    row.appendChild(card);

    list.appendChild(row);
  });
}

function toggleDone(id){

  const t =
    state.tasks.find(
      x => x.id === id
    );

  if(!t) return;

  t.done = !t.done;

  save();

  toast(
    t.done
    ? '✅ Marked complete'
    : 'Marked undone'
  );

  render();
}

function toggleFav(id){

  const t =
    state.tasks.find(
      x => x.id === id
    );

  if(!t) return;

  t.fav = !t.fav;

  save();

  render();
}

function deleteTask(id){

  const t =
    state.tasks.find(
      x => x.id === id
    );

  if(!t) return;

  if(
    !confirm(
      'Delete "' +
      t.title +
      '"?'
    )
  ) return;

  state.tasks =
    state.tasks.filter(
      x => x.id !== id
    );

  save();

  render();

  toast('🗑 Deleted');
}

const modalBg =
  document.getElementById('modalBg');

const fTitle =
  document.getElementById('fTitle');

const fDate =
  document.getElementById('fDate');

const fTime =
  document.getElementById('fTime');

const fDuration =
  document.getElementById('fDuration');

const fType =
  document.getElementById('fType');

const fNotes =
  document.getElementById('fNotes');

const fFavSwitch =
  document.getElementById('fFavSwitch');

const editIdInput =
  document.getElementById('editId');

const deleteBtn =
  document.getElementById('deleteBtn');

const modalTitle =
  document.getElementById('modalTitle');

function fillDateOptions(){

  const today = new Date();

  today.setHours(0,0,0,0);

  fDate.innerHTML = '';

  for(let i = -14; i <= 14; i++){

    const d =
      new Date(today);

    d.setDate(
      today.getDate() + i
    );

    const opt =
      document.createElement('option');

    const index =
      (d.getDay()+1)%7;

    opt.value =
      dateKey(d);

    opt.textContent =
      DOW[index] +
      ' Day ' +
      (index+1);

    fDate.appendChild(opt);
  }
}

function openAdd(){

  state.editingId = null;

  modalTitle.textContent =
    'New Task';

  fillDateOptions();

  fTitle.value = '';

  fDate.value =
    state.activeDate ||
    todayKey();

  fTime.value = '08:00';

  fDuration.value = '30';

  fType.value = 'task';

  fNotes.value = '';

  fFavSwitch.classList.remove('on');

  editIdInput.value = '';

  deleteBtn.style.display =
    'none';

  modalBg.classList.add('show');

  setTimeout(
    () => fTitle.focus(),
    100
  );
}

function openEdit(id){

  const t =
    state.tasks.find(
      x => x.id === id
    );

  if(!t) return;

  state.editingId = id;

  modalTitle.textContent =
    'Edit Task';

  fillDateOptions();

  fTitle.value =
    t.title;

  fDate.value =
    t.dateKey;

  fTime.value =
    t.time || '08:00';

  fDuration.value =
    t.duration || 30;

  fType.value =
    t.type || 'task';

  fNotes.value =
    t.notes || '';

  fFavSwitch.classList.toggle(
    'on',
    !!t.fav
  );

  editIdInput.value =
    id;

  deleteBtn.style.display =
    'block';

  modalBg.classList.add('show');
}

function closeModal(){

  modalBg.classList.remove(
    'show'
  );
}

function saveFromModal(){

  const title =
    fTitle.value.trim();

  if(!title){

    toast(
      'Title waa loo baahanyahay'
    );

    fTitle.focus();

    return;
  }

  const data = {

    title,

    dateKey:
      fDate.value,

    time:
      fTime.value || '',

    duration:
      Number(fDuration.value) || 0,

    type:
      fType.value,

    notes:
      fNotes.value.trim(),

    fav:
      fFavSwitch.classList.contains(
        'on'
      )
  };

  if(state.editingId){

    const t =
      state.tasks.find(
        x =>
          x.id ===
          state.editingId
      );

    if(t){
      Object.assign(
        t,
        data
      );
    }

  }else{

    const newT =
      Object.assign(

        {
          id: uid(),
          done: false,
          subs:
            data.type === 'group'
            ? []
            : undefined
        },

        data
      );

    state.tasks.push(
      newT
    );
  }

  save();

  closeModal();

  render();

  toast('💾 Saved');
}

document
  .getElementById('addTaskBtn')
  .onclick = openAdd;

document
  .getElementById('quickAddTop')
  .onclick = openAdd;

document
  .getElementById('modalClose')
  .onclick = closeModal;

document
  .getElementById('cancelBtn')
  .onclick = closeModal;

document
  .getElementById('saveBtn')
  .onclick = saveFromModal;

document
  .getElementById('deleteBtn')
  .onclick = () => {

    if(state.editingId){

      deleteTask(
        state.editingId
      );

      closeModal();
    }
  };

fFavSwitch.onclick = () =>
  fFavSwitch.classList.toggle(
    'on'
  );

modalBg.onclick = e => {

  if(e.target === modalBg){
    closeModal();
  }
};

const favToggle =
  document.getElementById(
    'favToggle'
  );

favToggle.onclick = () => {

  state.filterFav =
    !state.filterFav;

  favToggle
    .querySelector('svg')
    .setAttribute(
      'fill',
      state.filterFav
      ? '#7dd3fc'
      : 'currentColor'
    );

  render();
};

document
  .querySelectorAll('.nav-btn')
  .forEach(b => {

    b.onclick = () => {

      document
        .querySelectorAll('.nav-btn')
        .forEach(x =>
          x.classList.remove(
            'active'
          )
        );

      b.classList.add('active');

      const v =
        b.getAttribute(
          'data-view'
        );

      state.view =
        v === 'home'
        ? 'today'
        : v;

      state.filterFav =
        false;

      favToggle
        .querySelector('svg')
        .setAttribute(
          'fill',
          'currentColor'
        );

      render();
    };
  });

const drawerBg =
  document.getElementById(
    'drawerBg'
  );

document
  .getElementById('menuBtn')
  .onclick = () =>
    drawerBg.classList.add(
      'show'
    );

drawerBg.onclick = e => {

  if(e.target === drawerBg){

    drawerBg.classList.remove(
      'show'
    );
  }
};

document
  .querySelectorAll(
    '.drawer .menu-item'
  )
  .forEach(m => {

    m.onclick = () => {

      const a =
        m.getAttribute(
          'data-action'
        );

      if(a === 'today'){

        state.view = 'today';

      }else if(a === 'all'){

        state.view = 'all';

        state.activeDate =
          todayKey();

        buildDateStrip();

      }else if(a === 'favs'){

        state.view = 'favs';

      }else if(a === 'done'){

        state.view = 'done';

      }else if(a === 'clear'){

        if(
          confirm(
            'Clear all data?'
          )
        ){

          state.tasks = [];

          save();

          render();

          toast('Cleared');
        }

      }else if(a === 'about'){

        alert(
          'Daily Planner v1\nMade with ❤️'
        );
      }

      drawerBg.classList.remove(
        'show'
      );

      document
        .querySelectorAll(
          '.nav-btn'
        )
        .forEach(x => {

          x.classList.remove(
            'active'
          );

          if(
            x.getAttribute(
              'data-view'
            ) === 'home' &&
            state.view === 'today'
          ){

            x.classList.add(
              'active'
            );
          }

          if(
            x.getAttribute(
              'data-view'
            ) === state.view
          ){

            x.classList.add(
              'active'
            );
          }
        });

      render();
    };
  });

document
  .getElementById('searchBtn')
  .onclick = () => {

    const q =
      prompt('Raadi task:');

    if(!q) return;

    const res =
      state.tasks.filter(
        t =>
          (
            t.title +
            ' ' +
            (t.notes || '')
          )
          .toLowerCase()
          .includes(
            q.toLowerCase()
          )
      );

    if(res.length === 0){

      toast(
        'Lama helin: ' + q
      );

      return;
    }

    state.view = 'all';

    state.activeDate = null;

    const list =
      document.getElementById(
        'taskList'
      );

    list.innerHTML = '';

    const banner =
      document.getElementById(
        'viewBanner'
      );

    banner.style.display =
      'block';

    banner.textContent =
      '🔍 Search: "' +
      q +
      '" (' +
      res.length +
      ' results)';

    res.sort(
      (a,b) =>
        (a.dateKey+a.time)
        .localeCompare(
          b.dateKey+b.time
        )
    );

    res.forEach(t => {

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'task-row';

      row.innerHTML =
        '<div class="task-card">' +

          '<div class="task-head">' +

            '<div class="task-title">' +
              escapeHtml(
                t.title
              ) +
            '</div>' +

          '</div>' +

          '<div class="task-meta">' +

            escapeHtml(
              t.dateKey
            ) +

            (
              t.notes
              ?
              ' • ' +
              escapeHtml(
                t.notes
              )
              :
              ''
            ) +

          '</div>' +

        '</div>';

      list.appendChild(
        row
      );
    });
  };

document
  .getElementById('notifBtn')
  .onclick = () => {

    const upcoming =
      state.tasks.filter(
        t =>
          !t.done &&
          t.dateKey >= todayKey()
      ).length;

    toast(
      '🔔 ' +
      upcoming +
      ' task oo soo socota'
    );
  };

function seedIfEmpty(){

    },

      subs: [

        {
          id: uid(),

        },

        {
          id: uid(),

        },

        {
          id: uid(),

        }

      ]

    },

    {

    }

  ];

  save();
}

load();

seedIfEmpty();

buildDateStrip();

render();

})();
</script>
